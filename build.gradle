buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.eclipse.org/content/repositories/lemminx/' }
        maven { url 'https://www.jetbrains.com/intellij-repository/releases' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

ext {
    compileSdkVersion = 34
    buildToolsVersion = '34.0.0'
    targetSdkVersion = 34
    minSdkVersion = 26
    applicationId = "com.tyron.code"
    versionCode = 21
    versionName = "0.3.1 ALPHA-ZENITH-SANEADO-V14"
    
    common = [
        slf4j: 'org.slf4j:slf4j-api:1.7.36',
        commonsLang3: 'org.apache.commons:commons-lang3:3.12.0'
    ]
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }

    configurations.all { configuration ->
        exclude group: 'com.android.tools', module: 'r8'
        exclude group: "com.sun.activation", module: "javax.activation"
        exclude group: "javax.activation", module: "javax.activation-api"
        exclude group: "jakarta.xml.bind", module: "jakarta.xml.bind-api"
        
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
            force 'com.google.guava:guava:32.1.3-android'
            // v2026.158: Pacificador de RecyclerView para evitar el bloqueo de 'consistent resolution'
            force 'androidx.recyclerview:recyclerview:1.3.2'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
