repositories {
    google()
    mavenCentral()
}

configurations {
    rescue
}

dependencies {
    // [BASE]
    rescue 'androidx.annotation:annotation-jvm:1.7.0'
    rescue 'androidx.appcompat:appcompat:1.6.1'
    rescue 'androidx.core:core:1.12.0'
    rescue 'androidx.constraintlayout:constraintlayout:2.1.4'
    rescue 'com.google.android.material:material:1.11.0'
    
    // [LIFECYCLE]
    rescue 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    rescue 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
    rescue 'androidx.lifecycle:lifecycle-common:2.6.2'
    rescue 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    rescue 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'

    // [THE BIG FOUR - MISSING IN OMNI]
    rescue 'androidx.room:room-runtime:2.5.2'
    rescue 'androidx.room:room-common:2.5.2'
    rescue 'com.github.bumptech.glide:glide:4.16.0'
    rescue 'androidx.work:work-runtime:2.9.0'
    rescue 'com.google.code.gson:gson:2.10.1'

    // [DATABINDING SUPPORT]
    rescue 'androidx.databinding:databinding-common:8.1.0'
    rescue 'androidx.databinding:databinding-runtime:8.1.0'
    rescue 'androidx.databinding:databinding-adapters:8.1.0'
}

task downloadRescue(type: Copy) {
    from configurations.rescue
    into 'Dependencias_proyectos/v34_real_ammunition'
    rename { String fileName ->
        if (fileName.contains('annotation-jvm')) return 'annotation-1.7.0.jar'
        if (fileName.contains('lifecycle-common')) return 'lifecycle-common-2.5.1.jar'
        return fileName
    }
    doLast {
        println "✅ SUMINISTRO TOTAL COMPLETADO."
        File dir = new File('Dependencias_proyectos/v34_real_ammunition')
        println "Total archivos descargados: ${dir.listFiles().size()}"
    }
}
