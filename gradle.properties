# Configuración POWER-PC Optimizada (16GB RAM)
org.gradle.daemon=true
# 8GB: Potencia total
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# Configuración de Android
android.useAndroidX=true
android.enableJetifier=true
# PARCHE CRÍTICO: Ignorar librerías que rompen el proceso de Jetificación
android.jetifier.ignorelist=common,bundletool,converted-data-binding
android.nonTransitiveRClass=true

# Configuración de Kotlin
kotlin.incremental=true
kotlin.code.style=official
kotlin.caching.enabled=true
android.jetifier.ignorelist=common,bundletool,converted-data-binding,build-logic
