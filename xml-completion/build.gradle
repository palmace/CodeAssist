plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.tyron.completion.xml'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.tools.build:aapt2-proto:8.5.0-11315950'
    implementation 'com.google.protobuf:protobuf-java:3.21.5'

    implementation project(':actions-api')
    implementation project(':editor-api')
    implementation project(':event-manager')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'org.apache.bcel:bcel:6.5.0'
    // OMNI v44.8.5: Alineación con ATN v3 para evitar InvalidClassException en ViewBinding
    implementation 'org.antlr:antlr4-runtime:4.9.2'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'it.unimi.dsi:fastutil:8.5.8'
    implementation 'net.sf.kxml:kxml2:2.3.0'

    implementation project(':language-api')
    implementation project(':completion-api')
    implementation project(':common-jvm')
    implementation project(':java-completion')
    
    implementation project(':build-tools:android-common-resources')
    compileOnly project(':build-tools:javac')
    implementation project(':build-tools:project')
    implementation project(':build-tools:manifmerger')
    implementation project(':build-tools:xml-repository')

    // Android Tools (31.5.0)
    implementation 'com.android.tools:common:31.5.0'
    implementation 'com.android.tools:sdk-common:31.5.0'
    implementation 'com.android.tools:sdklib:31.5.0'
    implementation 'com.android.tools:annotations:31.5.0'
    implementation 'com.android.tools:repository:31.5.0'
    implementation 'com.android.tools:dvlib:31.5.0'
    implementation 'com.android.tools.layoutlib:layoutlib-api:31.5.0'
    implementation 'com.android.tools.ddms:ddmlib:31.5.0'
    
    implementation 'com.android.tools.build:builder:8.5.0'
    
    // Kotlin Compiler Embeddable
    api "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.24"
    implementation 'org.jetbrains.intellij.deps:trove4j:1.0.20200330'
    
    // Kotlin Stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all', '-Xextended-compiler-checks']
    }
}
