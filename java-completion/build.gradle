plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

configurations.configureEach {
    // v2026.152: BLOQUEO TOTAL DE R8
    exclude group: 'com.android.tools', module: 'r8'
    
    resolutionStrategy {
        force 'org.jetbrains.intellij.deps:trove4j:1.0.20200330'
        force 'com.android.tools:common:31.5.0'
        force 'com.android.tools:sdk-common:31.5.0'
    }
}

android {
    namespace 'com.tyron.completion.java'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdk 26
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation project(path: ':actions-api')
    implementation project(path: ':editor-api')
    implementation project(path: ':treeview')
    implementation project(path: ':common')
    implementation project(path: ':completion-api')
    implementation project(path: ':language-api')
    
    api project(path: ':build-tools:javac')
    api project(path: ':build-tools:logging')
    api project(path: ':build-tools:builder-api')
    api project(path: ':build-tools:build-logic')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$rootProject.ext.kotlin_version"
    implementation 'org.jetbrains.intellij.deps:trove4j:1.0.20200330'

    compileOnly 'androidx.recyclerview:recyclerview:1.3.2'
    compileOnly project(path: ':android-stubs')
    
    api 'com.github.javaparser:javaparser-core:3.25.9'
}
