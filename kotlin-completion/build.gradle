plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.tyron.kotlin_completion'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            kotlin.srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    implementation project(path: ':build-tools:javac')
    implementation project(path: ':build-tools:project')
    implementation project(path: ':build-tools:logging')
    implementation project(path: ':build-tools:build-logic')
    implementation project(path: ':completion-api')
    implementation project(path: ':actions-api')
    implementation project(path: ':editor-api')
    implementation project(path: ':common')
    implementation project(path: ':language-api')

    // OMNI v15.15: Sincronización con la versión global de Kotlin
    api "org.jetbrains.kotlin:kotlin-compiler-embeddable:$rootProject.ext.kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlin_version"
    
    implementation 'org.jetbrains:annotations:24.1.0'

    implementation 'org.jetbrains.exposed:exposed-core:0.32.1'
    implementation 'org.jetbrains.exposed:exposed-dao:0.32.1'
    implementation 'org.jetbrains.exposed:exposed-jdbc:0.32.1'
    implementation 'com.h2database:h2:1.4.200'
    
    implementation 'androidx.annotation:annotation:1.7.0'
    
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    def libDir = file('libs')
    if (libDir.exists()) {
        implementation files(libDir.listFiles().findAll { it.name.endsWith('.jar') })
    }
}
