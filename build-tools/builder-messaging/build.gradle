plugins {
    id 'java-library'
}

dependencies {
    implementation project(':common-jvm')
    implementation project(':build-tools:builder-base-services')
    implementation project(':build-tools:builder-base-annotations')
    implementation project(':build-tools:builder-build-operations')
    
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'com.esotericsoftware:kryo:5.5.0'
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'commons-io:commons-io:2.11.0'

    // Anotaciones necesarias para resolver "symbol: class Nullable"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}
