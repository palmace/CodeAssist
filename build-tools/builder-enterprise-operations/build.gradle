plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Cambiado de :common a :common-jvm para evitar ambigüedad
    implementation project(':common-jvm')
    implementation project(':build-tools:builder-build-operations')
}

sourceSets {
    main {
        java { srcDirs = [] }
    }
}
