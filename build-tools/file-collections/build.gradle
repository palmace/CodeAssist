plugins {
    id 'java-library'
}

dependencies {
    implementation project(':common-jvm')

    implementation project(':build-tools:builder-base-services')
    implementation project(':build-tools:builder-base-services-groovy')
    implementation project(':build-tools:builder-core-api')
    implementation project(':build-tools:builder-files')
    implementation project(':build-tools:builder-model-core')
    implementation project(':build-tools:builder-native')

    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'commons-io:commons-io:2.11.0'

    // Anotaciones necesarias para resolver symbols
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}
