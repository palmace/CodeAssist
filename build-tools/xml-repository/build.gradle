plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // Repositorio de Eclipse LemMinX
    maven {
        url 'https://repo.eclipse.org/content/repositories/lemminx/'
    }
}

dependencies {
    implementation project(path: ':common-jvm')
    implementation project(path: ':build-tools:manifmerger')
    implementation project(path: ':build-tools:project')

    // API en lugar de implementation para exponer las clases transitivamente
    api 'org.eclipse.lemminx:org.eclipse.lemminx:0.27.0'
    
    // LSP4J también como API
    api 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.1'
    api 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.21.1'
    
    implementation 'xerces:xercesImpl:2.12.2'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.11.0'
    
    // Kotlin compiler para clases de IntelliJ
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.24"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    compileOnly project(path: ':android-stubs')
}
