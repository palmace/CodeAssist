plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$kotlin_version"

    implementation 'androidx.annotation:annotation:1.6.0'
    implementation project(':common-jvm')
    implementation project(':event-manager')
    implementation project(':build-tools:manifmerger')

    // Dependencias explícitas para resolver errores de compilación
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.11.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly project(':android-stubs')
    compileOnly("com.android.tools:sdk-common:31.5.0") {
        transitive = false
    }

    implementation 'org.jetbrains:annotations:24.1.0'

    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        kotlin { srcDirs = ['src/main/java'] }
    }
}
