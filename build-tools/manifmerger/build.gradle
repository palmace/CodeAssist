plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "org.jetbrains:annotations:24.0.1"
    implementation project(':common-jvm')
    implementation project(':build-tools:logging')
    implementation project(':build-tools:jaxp:jaxp-internal')
    implementation project(':build-tools:jaxp:xml')
    
    compileOnly project(':android-stubs')
    
    // Sincronización con AGP 8.5.0 / Tools 31.5.0
    def toolsVersion = "31.5.0"
    implementation "com.android.tools.build:manifest-merger:$toolsVersion"
    implementation "com.android.tools:common:$toolsVersion"
    implementation "com.android.tools:sdk-common:$toolsVersion"
    implementation "com.android.tools:sdklib:$toolsVersion"
    
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        kotlin { srcDirs = ['src/main/java'] }
    }
}
