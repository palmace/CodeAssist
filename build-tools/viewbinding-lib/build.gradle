plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

configurations.implementation {
    exclude group: "org.jetbrains", module: "annotations"
}

dependencies {
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.2'
    // test
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'com.google.truth:truth:1.1.3'
    testImplementation 'com.google.testing.compile:compile-testing:0.19'

    implementation project(':common-jvm')
    // v2026.185: Sincronía Zenith - Regresamos a 4.9.2 para compatibilidad con ATN v3 de los lexers generados
    implementation 'org.antlr:antlr4-runtime:4.9.2'
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'
    implementation 'com.android.tools:annotations:24.5.0'
    api project(':javapoet')
    implementation project(":build-tools:javac")

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'commons-io:commons-io:2.11.0'

    implementation 'javax.xml.bind:jaxb-api:2.3.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
