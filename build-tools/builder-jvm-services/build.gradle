plugins {
    id 'java-library'
}

dependencies {
    implementation project(':build-tools:builder-functional')
    implementation project(':common-jvm')
    implementation project(':build-tools:builder-core-api')
    implementation project(':build-tools:builder-process-services')
    implementation project(':build-tools:builder-logging')
    implementation project(':build-tools:builder-base-services')
    implementation project(':build-tools:builder-file-temp')

    implementation 'javax.inject:javax.inject:1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java { srcDirs = [] }
    }
}
