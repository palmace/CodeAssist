plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':common-jvm')
    implementation project(':build-tools:builder-base-annotations')
    implementation project(':build-tools:builder-hashing')
    implementation project(':build-tools:builder-build-operations')
    
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.jetbrains:annotations:24.1.0'
    
    // Añadido para resolver "symbol: class Nullable" (javax.annotation)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'javax.inject:javax.inject:1'
    implementation 'org.ow2.asm:asm:9.5'
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
    }
}
