plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':common-jvm')
    implementation project(':build-tools:builder-base-services')
    implementation project(':build-tools:builder-core-api')
    implementation project(':build-tools:builder-model-core')
}

// Vaciado garantizado para evitar errores de internos de Gradle
sourceSets {
    main {
        java { srcDirs = [] }
    }
}
