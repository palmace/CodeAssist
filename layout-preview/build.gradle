plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.tyron.layoutpreview'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation project(':common-jvm')
    implementation project(':build-tools:xml-repository')
    implementation project(':layout-preview:vector-parser')
    implementation project(':build-tools:project')
    implementation project(':build-tools:manifmerger')
    implementation project(':build-tools:jaxp:xml')
    implementation project(':layout-preview:appcompat-widgets')
    implementation project(':layout-preview:constraintlayout')
    implementation project(':layout-preview:cardview')
    implementation project(':event-manager')

    // Dependencias para APIs de IntelliJ y Kotlin Reflect
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    
    // CAMBIO: Eliminar dependencia directa de intellij.platform:core que no existe
    // y reemplazar por kotlin-compiler-embeddable que sí tiene UserDataHolderEx
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$kotlin_version"
    
    // NUEVO: Dependencia directa a LemMinX para resolver los imports
    implementation 'org.eclipse.lemminx:org.eclipse.lemminx:0.27.0'
    
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    api project(':layout-preview:proteus-core')

    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.1.3"
    testImplementation "org.robolectric:robolectric:4.11.1"
}
